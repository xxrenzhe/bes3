[supervisord]
nodaemon=true
logfile=/dev/stdout
logfile_maxbytes=0
loglevel=info
pidfile=/tmp/supervisord.pid
user=root

[program:bes3-web]
directory=/app
command=node server.js
autostart=true
autorestart=true
startsecs=5
startretries=3
priority=100
stopsignal=TERM
stopasgroup=true
killasgroup=true
stopwaitsecs=12
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:bes3-worker]
directory=/app
command=./node_modules/.bin/tsx /app/scripts/worker-standalone.ts
autostart=true
autorestart=true
startsecs=5
startretries=3
priority=200
stopsignal=TERM
stopasgroup=true
killasgroup=true
stopwaitsecs=12
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
